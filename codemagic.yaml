# ============================================================================
#  Codemagic CI/CD — Meu Resgate (Capacitor + Vite/React)
#  Compila e assina o app para Android (.aab) e iOS (.ipa) sem precisar de Mac.
#
#  ANTES do primeiro build, configure na conta do Codemagic (ver checklist que
#  te passei no chat):
#   - Conectar o repositório GitHub creatyfy/my-rescue-rewards
#   - Android: subir a keystore em "Code signing identities" com reference name
#     >>> meuresgate_keystore <<<  (alias: meuresgate)
#   - iOS: adicionar a integração "App Store Connect API key" com nome
#     >>> meuresgate_asc <<<  (Issuer ID + Key ID + arquivo .p8)
#   - (publicação) Grupos de variáveis:
#       google_play  -> GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (JSON da conta de
#                       serviço do Google Play, marcado como "secure")
# ============================================================================

definitions:
  # Passos compartilhados entre Android e iOS (build do site + sincronização).
  scripts:
    - &install_deps
      name: Instalar dependências (npm)
      script: npm ci
    - &build_web
      name: Build do site + cap sync
      script: |
        npx vite build
        npx cap sync

workflows:
  # --------------------------------------------------------------------------
  #  ANDROID APK (TESTE)  ->  gera app-release.apk assinado pra instalar no
  #  celular. Não publica em loja. Use este workflow pra testar o app.
  # --------------------------------------------------------------------------
  android-apk:
    name: Meu Resgate — Android APK (teste)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - meuresgate_keystore
      vars:
        PACKAGE_NAME: "br.com.meuresgate.app"
      node: 22
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - *install_deps
      - *build_web
      - name: Gerar keystore.properties a partir da keystore do Codemagic
        script: |
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build do APK (release assinado)
        script: |
          set -e
          echo "== JDKs disponiveis =="
          /usr/libexec/java_home -V 2>&1 || true
          JDK21=$(/usr/libexec/java_home -v 21 2>/dev/null || true)
          if [ -z "$JDK21" ]; then
            echo "JDK 21 ausente; instalando Temurin 21..."
            brew install --cask temurin@21 || brew install temurin@21 || true
            JDK21=$(/usr/libexec/java_home -v 21 2>/dev/null || true)
          fi
          if [ -z "$JDK21" ]; then echo "ERRO: JDK 21 indisponivel na imagem"; exit 1; fi
          export JAVA_HOME="$JDK21"
          echo "== JAVA_HOME=$JAVA_HOME =="
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - i9plex@gmail.com
        notify:
          success: true
          failure: true

  # --------------------------------------------------------------------------
  #  ANDROID AAB (PUBLICAÇÃO MANUAL)  ->  gera app-release.aab assinado pra
  #  você BAIXAR e subir você mesmo no Play Console (canal de teste fechado).
  #  Não publica automático, não precisa de chave de serviço do Google.
  #  USE ESTE para enviar o app pra Play Store.
  # --------------------------------------------------------------------------
  android-aab:
    name: Meu Resgate — Android AAB (baixar e subir manual)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - meuresgate_keystore
      vars:
        PACKAGE_NAME: "br.com.meuresgate.app"
      node: 22
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - *install_deps
      - *build_web
      - name: Gerar keystore.properties a partir da keystore do Codemagic
        script: |
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build do AAB (release assinado)
        script: |
          set -e
          JDK21=$(/usr/libexec/java_home -v 21 2>/dev/null || true)
          if [ -z "$JDK21" ]; then
            brew install --cask temurin@21 || brew install temurin@21 || true
            JDK21=$(/usr/libexec/java_home -v 21 2>/dev/null || true)
          fi
          if [ -z "$JDK21" ]; then echo "ERRO: JDK 21 indisponivel na imagem"; exit 1; fi
          export JAVA_HOME="$JDK21"
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - i9plex@gmail.com
        notify:
          success: true
          failure: true

  # --------------------------------------------------------------------------
  #  ANDROID  ->  gera app-release.aab assinado E publica automático (avançado)
  #  Só use quando tiver a chave de serviço do Google Play configurada.
  # --------------------------------------------------------------------------
  android:
    name: Meu Resgate — Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - meuresgate_keystore
      groups:
        - google_play          # remova esta linha se ainda não for publicar
      vars:
        PACKAGE_NAME: "br.com.meuresgate.app"
      node: 22
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - *install_deps
      - *build_web
      - name: Gerar keystore.properties a partir da keystore do Codemagic
        script: |
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build do AAB (release)
        script: |
          set -e
          JDK21=$(/usr/libexec/java_home -v 21 2>/dev/null || true)
          if [ -z "$JDK21" ]; then
            brew install --cask temurin@21 || brew install temurin@21 || true
            JDK21=$(/usr/libexec/java_home -v 21 2>/dev/null || true)
          fi
          if [ -z "$JDK21" ]; then echo "ERRO: JDK 21 indisponivel na imagem"; exit 1; fi
          export JAVA_HOME="$JDK21"
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - i9plex@gmail.com
        notify:
          success: true
          failure: true
      # Publica automaticamente na faixa de teste interno da Play Store.
      # Requer: app já criado na Play Console + GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # --------------------------------------------------------------------------
  #  iOS  ->  gera Meu Resgate.ipa e envia pro TestFlight
  # --------------------------------------------------------------------------
  ios:
    name: Meu Resgate — iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: meuresgate_asc
    environment:
      # Sem bloco ios_signing: a assinatura é feita manualmente no script abaixo,
      # que CRIA o certificado e o perfil (o bloco automático só busca existentes).
      vars:
        BUNDLE_ID: "br.com.meuresgate.app"
      node: 22
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - *install_deps
      - *build_web
      - name: Criar certificado e perfil de assinatura (modo explícito)
        script: |
          set -e
          keychain initialize

          # O App ID é "Universal", então fetch-signing-files (que filtra por
          # plataforma) não o encontra. Fazemos a assinatura de forma explícita:
          # 1) gerar chave + certificado, 2) achar o bundle pelo resource id
          # (sem filtro de plataforma), 3) criar o perfil ligando os dois.

          # 0) Revoga certificados de distribuição antigos. Cada build gera uma
          #    chave privada nova; como não guardamos a chave dos anteriores,
          #    eles são inúteis, e a Apple bloqueia criar um novo se já existe um.
          app-store-connect certificates list --json 2>/dev/null > /tmp/certs.json || echo "[]" > /tmp/certs.json
          for cid in $(python3 -c "import json; d=json.load(open('/tmp/certs.json')); d=[d] if isinstance(d,dict) else d; print('\n'.join(c['id'] for c in d if 'DISTRIBUTION' in str((c.get('attributes') or {}).get('certificateType') or c.get('certificateType') or '').upper()))" 2>/dev/null); do
            echo "Revogando certificado de distribuicao antigo: $cid"
            app-store-connect certificates delete "$cid" || true
          done

          # 1) Chave privada nova + certificado de distribuição (salvo em p12)
          openssl genrsa -out /tmp/ios_dist_key.pem 2048
          CERT_ID=$(app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/ios_dist_key.pem \
            --save \
            --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'] if isinstance(d, dict) else d[0]['id'])")
          echo "Certificado criado: $CERT_ID"

          # 2) Resource ID do bundle existente (listagem SEM filtro de plataforma)
          BUNDLE_RES_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d, 'bundle nao encontrado'; print(d[0]['id'])")
          echo "Bundle resource ID: $BUNDLE_RES_ID"

          # 3) Criar o perfil app_store ligando bundle + certificado (salvo em disco)
          app-store-connect profiles create "$BUNDLE_RES_ID" \
            --certificate-ids "$CERT_ID" \
            --type IOS_APP_STORE \
            --save

          # 4) Importar o certificado no keychain e aplicar os perfis no projeto
          keychain add-certificates
          xcode-project use-profiles
      - name: Definir build number (incrementa a partir do TestFlight)
        script: |
          set -e
          # Pega o último build já enviado ao TestFlight e soma 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEW=$(( LATEST + 1 ))
          echo "Build number: TestFlight=$LATEST -> novo=$NEW"
          # Atualiza CURRENT_PROJECT_VERSION (Debug e Release) no projeto.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          echo "CURRENT_PROJECT_VERSION definido para $NEW"
      - name: Build do IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - i9plex@gmail.com
        notify:
          success: true
          failure: true
      # Envia a build pro TestFlight automaticamente.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
